version: "3.8"

services:
  policypilot-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      # Model names: see https://ai.google.dev/gemini-api/docs/models
      - GEMINI_LLM_MODEL=${GEMINI_LLM_MODEL:-gemini-flash-lite-latest}
      - EMBEDDINGS_PROVIDER=${EMBEDDINGS_PROVIDER:-gemini}
      - GEMINI_EMBEDDING_MODEL=${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      # Retrieval — threshold tuned on 10-question dev split
      - RETRIEVAL_SIMILARITY_THRESHOLD=${RETRIEVAL_SIMILARITY_THRESHOLD:-0.55}
      - TOP_K_RETRIEVAL=${TOP_K_RETRIEVAL:-5}
      - RRF_K=${RRF_K:-60}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      # Security / Rate limiting
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-30}
      - DAILY_REQUEST_CAP=${DAILY_REQUEST_CAP:-500}
      # Set TRUSTED_PROXIES to the IP(s) of your hosting platform's reverse proxy.
      # See README "Rate limiting behind a proxy" for details.
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-127.0.0.1,::1}
      # CORS: comma-separated origins allowed to call the API (e.g. your Vercel URL)
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - COMPANY_NAME=${COMPANY_NAME:-Northwind Labs}
      - SQLITE_DB_PATH=/app/data/policypilot.db
      - CHROMA_PERSIST_DIR=/app/data/chroma
    volumes:
      - policypilot_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  policypilot-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      policypilot-backend:
        condition: service_healthy

volumes:
  policypilot_data:
